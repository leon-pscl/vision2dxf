# The 26 primary GarmentCode body keys this engine produces.
# views: F = front, S = side, "-" = not visible in a silhouette (tailor entry).
# confidence is the default written to measurement_report.yaml.
measurements:
  height:               {unit: cm, views: [F], confidence: high}
  head_l:               {unit: cm, views: [S], confidence: medium}
  neck_w:               {unit: cm, views: [F], confidence: medium}
  shoulder_w:           {unit: cm, views: [F], confidence: medium}
  shoulder_incl:        {unit: deg, views: [F], confidence: medium}
  armscye_depth:        {unit: cm, views: [F], confidence: medium}
  arm_length:           {unit: cm, views: [F], confidence: medium}
  arm_pose_angle:       {unit: deg, views: [F], confidence: high}
  bust:                 {unit: cm, views: [F, S], confidence: medium}
  underbust:            {unit: cm, views: [F, S], confidence: low}
  waist:                {unit: cm, views: [F, S], confidence: medium}
  hips:                 {unit: cm, views: [F, S], confidence: medium}
  leg_circ:             {unit: cm, views: [F, S], confidence: medium}
  wrist:                {unit: cm, views: [F], confidence: low}
  back_width:           {unit: cm, views: [F, S], confidence: low}
  waist_back_width:     {unit: cm, views: [F, S], confidence: low}
  hip_back_width:       {unit: cm, views: [F, S], confidence: low}
  waist_line:           {unit: cm, views: [S], confidence: medium}
  waist_over_bust_line: {unit: cm, views: [S], confidence: low}
  bust_line:            {unit: cm, views: [S], confidence: low}
  vert_bust_line:       {unit: cm, views: [S], confidence: medium}
  hips_line:            {unit: cm, views: [F, S], confidence: medium}
  crotch_hip_diff:      {unit: cm, views: [F, S], confidence: medium}
  hip_inclination:      {unit: deg, views: [F], confidence: medium}
  bust_points:          {unit: cm, views: [], confidence: estimated}
  bum_points:           {unit: cm, views: [], confidence: estimated}
