# Runtime configuration. Model paths live here so fine-tuned weights can be
# swapped in without code changes.
camera:
  index: 0
  rotation: 90          # degrees clockwise applied to raw frames
  pad_frac: 0.08        # grey border added after rotation, as a fraction of the long side,
                        # so a body filling a tight room is not read as cut off

models:
  seg: models/yolo26s-seg.pt
  pose: models/yolo26s-pose.pt
  imgsz: 1280
  retina_masks: true
  # Fill these in with "python tools/provision_models.py --write-hashes" once the
  # station is provisioned. While they are null the weights are used as found;
  # once set they are enforced, and the app still never downloads anything.
  seg_sha256: null
  pose_sha256: null

thresholds:
  keypoint_conf: 0.5
  mask_conf: 0.5
  arm_angle_min_deg: 15       # A-pose: upper arm away from torso line
  arm_angle_max_deg: 60
  side_shoulder_ratio_max: 0.25   # side view is side-on when shoulder span < 25% of front
  frame_margin_frac: 0.02         # mask must sit this far inside top and bottom
  body_height_frac: 0.50          # and span at least this much of the padded frame height
  body_centre_band_frac: 0.30     # body centre must fall inside the middle of the width
  morph_kernel_px: 5
  hole_fill_max_area_px: 500

defaults:
  bust_points_ratio: 0.170        # GarmentCode mean_all.yaml: 16.95 / 99.84
  bum_points_ratio: 0.176         # GarmentCode mean_all.yaml: 18.23 / 103.48

paths:
  sessions: data/sessions

storage:
  data_dir: data
  retention_days_images: 30       # placeholder; set from the client agreement
  purge_on_startup: true          # run purge_images() whenever the app starts
  keep_debug_after_confirm: false # delete debug/ once a session is confirmed
  unconfirmed_days: 7             # never-confirmed sessions are purged this soon
  consent_version: "2026-10-11"   # version of the consent text the capture page shows

enhance:
  white_balance: 1              # grey-world; 0 disables
  clahe_clip: 2.0               # local contrast on lightness only; 0 disables
  clahe_grid: 8
  bilateral_d: 7                # edge-preserving denoise; 0 disables
  bilateral_sigma_colour: 50
  bilateral_sigma_space: 50

uploads:
  max_bytes: 25000000           # 25 MB
  max_pixels: 40000000          # 40 MP
  allowed_types: [image/jpeg, image/png, image/webp]

garmentcode:
  # Pinned revision the export schema is written against (brief 3.2). Verify
  # with tools/verify_garmentcode.py before trusting an export.
  repository: https://github.com/maria-korosteleva/GarmentCode
  commit: "8d8b1a6b7f3ad8d6b2b2b4bbdd1b0a7b00000000"

profiles:
  # Which body keys each garment profile must have before export is allowed
  # (brief 15.3). A profile that needs fewer fields can export sooner.
  core_upper_body: [height, neck_w, shoulder_w, shoulder_incl, armscye_depth, bust, waist]
  top_shirt: [height, neck_w, shoulder_w, shoulder_incl, armscye_depth, arm_length,
              arm_pose_angle, bust, underbust, waist, wrist, back_width, bust_line,
              vert_bust_line, waist_over_bust_line]
  skirt: [height, waist, hips, hips_line, waist_back_width, hip_back_width,
          hip_inclination, crotch_hip_diff]
  trousers: [height, waist, hips, hips_line, leg_circ, crotch_hip_diff,
             hip_inclination, waist_back_width, hip_back_width]
  full: [height, head_l, neck_w, shoulder_w, shoulder_incl, armscye_depth, arm_length,
         arm_pose_angle, bust, underbust, waist, hips, leg_circ, wrist, back_width,
         waist_back_width, hip_back_width, waist_line, waist_over_bust_line, bust_line,
         vert_bust_line, hips_line, crotch_hip_diff, hip_inclination,
         bust_points, bum_points]
