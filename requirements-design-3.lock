# Design 3 - frozen benchmark environment.
#
# This is the full `pip freeze` of the interpreter that produced results/design_3_*,
# not a minimal requirement list. Trimming it would guess which transitive package
# changed a number, and a benchmark result has to be reproducible exactly.
#
# Direct requirements Design 3 actually imports or measures with:
#   numpy     solving cross sections, LSCM, ARAP
#   shapely   boundary closure and self-intersection checks
#   ezdxf     the common DXF exporter
#   pydantic  the common pattern schema
#   PyYAML    measurement fixtures and frozen configuration
#   reportlab, Pillow   pattern PDF and preview export
#   radon     Metric 5, pinned to 6.0.1 as the protocol requires
#   scipy, pandas      present in the environment; Design 3 imports neither
#   trimesh, libigl    NOT installed and NOT used. Flattening is a project
#                      implementation over dense NumPy matrices (see
#                      backend/app/flattening/parameterization.py).
#
# The benchmark runs with `python benchmark/run_design_3.py` under this interpreter and
# pins BLAS thread counts from benchmark/config-design-3.yaml before NumPy is imported.
