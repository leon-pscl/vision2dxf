[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision2dxf"
version = "0.1.0"
description = "Skeletal design-comparison prototype for garment pattern generation"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "radon>=6.0.0",
    "plotly>=5.18.0",
    "ezdxf>=0.18.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
