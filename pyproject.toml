[project]
name = "bodymeasure"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]   # "." so tests.synthetic is importable
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "PL"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"src/bodymeasure/store.py" = ["PLR0913"]  # log_edit takes the columns it writes
"bench/*" = ["PLR0913"]  # projection parameters travel together
"src/bodymeasure/measure.py" = ["PLR0913", "PLR0915"]  # a flat transcription of the
                                                        # brief 5.7 table; splitting it would
                                                        # only pass the same context around
"tests/*" = ["D103", "PLR2004"]
"src/bodymeasure/api.py" = ["PLR0913"]   # a route signature is the request schema
