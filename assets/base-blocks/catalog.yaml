# The pinned, reviewed base blocks this installation offers.
#
# A template file is content-addressed by its own filename and pinned here by sha256. If
# the bytes change the block is refused rather than silently becoming a different block.
# The templates themselves are committed beside this file, so the catalog works on a
# fresh clone and its pinned hashes mean something.
version: "1.0.0"
default: bodice-ref-a

# The body these blocks are declared to fit. It is an operator-revisable assumption, not
# a measurement of the templates: a template is a garment, and a garment is longer, wider
# and lower-necked than the body it fits. Declaring it makes every difference
# body-to-body, and it is recorded in every manifest. The declared ease preset is the
# ease the blocks already carry, so keeping that preset leaves their fit alone.
reference:
  profile: body_measurements.yaml
  ease_preset: fitted

blocks:
  - id: bodice-ref-a
    label: Bodice reference A
    source: 5f8a1865c9aa84855f6122db55ad4e93.json
    sha256: 907f8fa2b0fadfe665b938c72581aa7c9ce5378f4d2f3ace6a6d99cc483df053
    reviewed: true

  - id: bodice-ref-b
    label: Bodice reference B
    source: 33578877396454b71782bdee252fe8ef.json
    sha256: 2f7070b1ebd69f4ffe2673da8c8a036fb1552145af6dd590fd40ae448c87ac49
    reviewed: true

  - id: bodice-ref-c
