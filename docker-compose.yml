services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # The whole repo, so source, config, scripts, weights and captured data all
      # come from the host. Dependencies live in /opt/venv, outside /app, so they
      # survive the mount -- but changing them still needs `up --build`.
      - .:/app
    command: ["uvicorn", "bodymeasure.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
