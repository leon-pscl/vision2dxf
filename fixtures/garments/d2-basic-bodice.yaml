# Frozen garment configuration for every Design 2 benchmark trial.
#
# One garment for every case, so the measured differences come from the measurements and
# not from the configuration. The solver, curve refit, seam balance and envelope settings
# are read from backend/app/config/transformation.yaml, not from here.
configuration_version: "1.0.0"
approved_by: project-lead
approval_date: '2026-10-13'
approval_status: approved

# Passed verbatim to generate_pattern as the `garment` argument.
#
# `base_block_id` is the frozen block, and it is named here rather than left to the
# catalog default so that the frozen choice is visible in one place. Design 2 always
# transforms this block: it never searches among templates, and swapping this value would
# be a new base_block_version and a complete rerun of every trial.
settings:
  base_block_id: bodice-ref-a
  garment_type: basic_bodice
  ease_preset: fitted
  cutting_join: miter
  paper_size: A0
  paper_orientation: landscape
  # The transformation envelope is not confirmed. Confirming it would let an
  # out-of-envelope target through, and the control case relies on that refusal.
  confirm_envelope: false