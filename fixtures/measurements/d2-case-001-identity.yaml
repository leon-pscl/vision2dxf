# Design 2 benchmark case fixture. Frozen before any measured trial ran.
#
# Pseudonymous: carries no participant name and no direct identifier. The engine
# consumes only confirmed values, converted to millimetres internally.
#
# This is the base block's own declared reference profile
# (assets/base-blocks/catalog.yaml -> reference.profile), which makes it the identity
# case: every measurement difference is zero, so a correct transformation reproduces the
# block exactly. A transformation that cannot reproduce its own base block is broken.
case:
  case_id: d2-case-001-identity
  profile: block_reference
  role: mandatory
  unit: cm
  value_status: confirmed
  provenance: >-
    Base-block reference profile. Declared in assets/base-blocks/catalog.yaml as the body
    the frozen block is considered to fit, not measured from the template. The engine
    consumes only confirmed values, converted to millimetres internally.
  approval_status: approved
  approved_by: project-lead
  approval_date: '2026-10-13'
  contains_direct_identifier: false

