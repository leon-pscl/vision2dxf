# Objective weights, solver limits, curve refit limits, seam balancing, the tested
# envelope and the influence map.
#
# Geometry tolerances, ease presets, seam allowances and paper sizes live in
# drafting.yaml. Which blocks exist and the body each is declared to fit live in
# assets/base-blocks/catalog.yaml.
version: "1.0.0"

# Where the pinned catalog and its templates live, as paths under the first ancestor
# directory that contains them. Resolved by search rather than a fixed depth so the same
# config works in the repository and in the flatter container image.
base_block:
  catalog_directory: assets/base-blocks
  # Nearest first. The catalog's own templates ship with it; the full GarmageSet library
  # is optional and only needed to select a template the catalog does not list.
  template_directories:
    - assets/base-blocks/templates
    - templates

# The design objective. lambda = w_smoothness / w_landmark; lambda = 0 interpolates the
# landmark targets exactly and lets the surface between them do whatever it likes, so a
# small non-zero weight buys a smooth panel for a residual well under the tolerance.
objective:
  w_landmark: 1.0
  w_smoothness: 1.0e-6

solver:
  method: thin_plate_spline
  # A torso panel resolves to well under twenty landmarks; the cap is there so a
  # malformed influence map fails loudly instead of inverting a huge dense matrix.
  max_landmarks: 64
  # r^2 log r on a normalised frame is well conditioned; past this the targets are
  # effectively dependent and the solve is refused rather than returned.
  condition_number_limit: 1.0e+12
  landmark_residual_tol_mm: 0.5
  # Two targets closer than this are one landmark: merged, and reported as merged.
  coincident_landmark_mm: 0.5

curve_refit:
  # Samples used to refit an edge carried as a single cubic against its own
  # parameterisation, so a notch at 0.25 stays a quarter along the same stretch.
  samples: 64
  # A control handle longer than this multiple of the chord is a spike, not a curve.
  max_handle_ratio: 3.0
  # Turn between consecutive samples. Past this the edge has looped or spiked and is
  # rejected; nothing is smoothed over.
  max_turn_deg: 120.0

seam_balance:
  # Balancing needs solved geometry, so the pipeline solves, balances and solves again.
  max_iterations: 6
  tolerance_mm: 1.0
  # How far a measured garment dimension may land from what the influence map said it
  # would. Wider than the seam tolerance because a dimension is the sum of several
  # landmark moves and the curve between them.
  achieved_tolerance_mm: 3.0
  achieved_tolerance_deg: 1.0

# The range each measurement difference was tested over. Beyond it the result is an
# extrapolation and needs an explicit operator confirmation, recorded in the manifest.
# More than stop_factor past the range is refused however it is confirmed.
envelope:
  stop_factor: 2.0
  default:
    max_abs_mm: 100.0
    max_abs_deg: 10.0
    max_pct: 15.0
  measurements:
    bust_circumference:     { max_abs_mm: 100.0, max_pct: 15.0 }
    waist_circumference:    { max_abs_mm: 100.0, max_pct: 18.0 }
    back_width_full:        { max_abs_mm: 60.0,  max_pct: 15.0 }
    waist_back_width_full:  { max_abs_mm: 60.0,  max_pct: 18.0 }
    shoulder_width_full:    { max_abs_mm: 50.0,  max_pct: 15.0 }
    neck_width_half:        { max_abs_mm: 25.0,  max_pct: 20.0 }
    neck_to_waist_level:    { max_abs_mm: 60.0,  max_pct: 15.0 }
    armscye_depth_vertical: { max_abs_mm: 40.0,  max_pct: 20.0 }
    shoulder_slope_degrees: { max_abs_deg: 8.0,  max_pct: 25.0 }

# The inverse of the influence map: how much of a measurement difference each measured
# garment dimension is expected to absorb. It is what achieved geometry is checked
# against, so the check is against the request rather than against itself.
achieved_dimensions:
  bust_girth:
    from: { bust_circumference: 1.0, bust_mm: 1.0 }
  waist_girth:
    from: { waist_circumference: 1.0, waist_mm: 1.0 }
  # back_width_full moves the back out and the front in, so it lands on the back panel
  # in full and leaves the girth alone.
  back_width:
    from: { back_width_full: 1.0 }
  waist_back_width:
    from: { waist_back_width_full: 1.0 }
  shoulder_width:
    from: { shoulder_width_full: 1.0 }
  # Half width per side, so the tip-to-tip dimension takes twice the difference.
  neck_width:
    from: { neck_width_half: 2.0 }
  neck_to_waist:
    from: { neck_to_waist_level: 1.0 }
  # The hem follows the waist down the panel, so it absorbs the same difference.
  neck_to_hem:
    from: { neck_to_waist_level: 1.0 }
  armscye_depth:
    from: { armscye_depth_vertical: 1.0 }
  shoulder_slope_deg:
    unit: deg
    from: { shoulder_slope_degrees: 1.0 }

# Every millimetre of movement is attributable to one measurement difference. A
# measurement moves only the landmarks listed here, with the weight given; a measurement
# with an empty op list records that absence deliberately and is reported to the operator
# as unmapped rather than silently ignored.
#
# Panels are whole front and back panels mirrored about their own centre line, so a
# weight is the offset applied to ONE side and a girth lands as 2 x offset per panel.
# Directions are semantic and resolved against each panel's own frame.
#
# Girth and width are deliberately split so each lands exactly rather than both pushing
# the same landmark: bust_circumference sets the front panel, and back_width_full moves
# the back out and the front in by the same amount, which changes the back's share of the
# girth without changing the girth. The same split applies at the waist.
influence:
  version: "1.0.0"
  measurements:
    bust_circumference:
      region: bust
      ops:
        - { mode: translate, direction: outward, roles: [underarm], panels: [front], weight: 0.5 }
    back_width_full:
      region: bust
      ops:
        - { mode: translate, direction: outward, roles: [underarm], panels: [back],  weight: 0.5 }
        - { mode: translate, direction: inward,  roles: [underarm], panels: [front], weight: 0.5 }
    waist_circumference:
      region: waist
      ops:
        - { mode: translate, direction: outward, roles: [waist_side], panels: [front], weight: 0.5 }
    waist_back_width_full:
      region: waist
      ops:
        - { mode: translate, direction: outward, roles: [waist_side], panels: [back],  weight: 0.5 }
        - { mode: translate, direction: inward,  roles: [waist_side], panels: [front], weight: 0.5 }
    shoulder_width_full:
      region: shoulder
      # Shoulder width is tip to tip across the panel, so each tip takes half.
      ops:
        - { mode: translate, direction: outward, roles: [shoulder_tip], panels: [front, back], weight: 0.5 }
    shoulder_slope_degrees:
      region: shoulder
      # Runs after every translate and keeps the tip's horizontal distance, so the
      # across-shoulder width it shares the landmark with still lands.
      ops:
        - { mode: set_angle, pivot: side_neck, roles: [shoulder_tip], panels: [front, back], weight: 1.0 }
    neck_width_half:
      region: neck
      # Already a half width: centre line to side neck, which is the offset itself.
      ops:
        - { mode: translate, direction: outward, roles: [side_neck], panels: [front, back], weight: 1.0 }
    neck_to_waist_level:
      region: length
      ops:
        - { mode: translate, direction: down, roles: [waist_side], panels: [front, back], weight: 1.0 }
    armscye_depth_vertical:
      region: armscye
      ops:
        - { mode: translate, direction: down, roles: [underarm], panels: [front, back], weight: 1.0 }

    # Deliberately unmapped. Each is a difference the block has no landmark to express,
    # so it is reported to the operator instead of being absorbed somewhere it does not
    # belong. See README "Known limits".
    hip_circumference:          { region: hip,    ops: [] }   # no hip edge: the block ends at its hem
    hip_back_width_full:        { region: hip,    ops: [] }   # no hip edge
    waist_to_hip_vertical:      { region: hip,    ops: [] }   # no hip edge
    buttock_spacing_full:       { region: hip,    ops: [] }   # no hip edge
    neck_to_bust_apex_vertical: { region: bust,   ops: [] }   # no apex landmark: the blocks are dartless
    bust_apex_spacing_full:     { region: bust,   ops: [] }   # no apex landmark
    underbust_circumference:    { region: bust,   ops: [] }   # no underbust landmark
    neck_to_bust_level:         { region: bust,   ops: [] }   # bust level is a reference line, not a landmark
    bust_to_waist_vertical:     { region: length, ops: [] }   # the waist level is set by neck_to_waist_level
    stature:                    { region: body,   ops: [] }   # whole-body scale is not a block dimension
    arm_length:                 { region: sleeve, ops: [] }   # no sleeves

    # Ease, in millimetres of girth, from the selected preset.
    bust_mm:
      region: ease
      ops:
        - { mode: translate, direction: outward, roles: [underarm], panels: [front], weight: 0.5 }
    waist_mm:
      region: ease
      ops:
        - { mode: translate, direction: outward, roles: [waist_side], panels: [front], weight: 0.5 }
    hip_mm:                     { region: ease,   ops: [] }   # no hip edge

  # A landmark the block defines against another one rather than against a measurement.
  # The hem is the bottom of the block, so it follows the waist down the panel instead of
  # standing still and stretching the side seam past it.
  dependencies:
    - { axis: y, role: center_hem, follows: waist_side, panels: [front, back], weight: 1.0 }
