# Surface reconstruction, garment-surface, seam-network and flattening configuration.
#
# Every number a geometry function reads lives here. Entries tagged ASSUMED are
# values chosen while building this prototype: no measurement in body_measurements.yaml
# and no published anthropometric table supports them. They are listed again, with the
# reason, in ASSUMPTIONS.md, and each one that reaches the geometry is emitted into
# generation-manifest.json as a SurfaceAssumption.
version: "3.0.0"
units: mm

cross_section:
  # ellipse | superellipse. The exponent is only read for `superellipse`.
  model: superellipse
  # ASSUMED. A torso section is flatter at the sides than an ellipse and squarer at the
  # front; 2.3 was picked because it looks right on the fixture profiles. Nothing measures
  # it. n = 2 is an exact ellipse and is offered as the alternative model.
  exponent: 2.3
  exponent_range: [2.0, 4.0]
  # Chords used for the numerical perimeter. 2048 puts the discretisation error below
  # 1e-4 mm on a 1 m section, which is two orders under the residual tolerance.
  perimeter_samples: 2048
  # ASSUMED, one per level: section depth / section width (b/a). Used when a level has a
  # circumference but no width whose anatomical definition matches the section, and to
  # give the upper-chest section a depth. These six numbers are the largest single
  # assumption in the reconstruction.
  depth_to_width:
    neck: 0.85
    upper_chest: 0.70
    bust: 0.72
    underbust: 0.70
    waist: 0.74
    hip: 0.75
  # Front/back asymmetry is off: no input establishes it. bust_points is an apex
  # protrusion, not a half-depth, so it is recorded as unused rather than guessed at.
  front_back_asymmetry: false
  # Solver limits for the depth/width root find.
  solver:
    max_iterations: 200
    tolerance_mm: 1.0e-6
    # A section whose numerical perimeter misses its target by more than this is a
    # blocking error. ASSUMED: calibrated only against the four supplied profiles, where
    # the solver lands under 1e-5 mm. Design doc asks for this to be exposed, not fixed.
    residual_tolerance_mm: 0.5

levels:
  # ASSUMED. The underbust level is not derivable: `underbust` is a circumference with no
  # level of its own. 0.30 places it just under the bust, which is where it sits on the
  # fixture profiles. Changing it moves one section.
  underbust_fraction_of_bust_to_waist: 0.30
  # ASSUMED. hips_line is measured from the crotch point, so the hip level cannot be
  # placed in the neck-referenced frame. The hip section is therefore off by default; the
  # value below is only read when include_hip_section is turned on.
  include_hip_section: false
  waist_to_hip_mm: 200.0
  # ASSUMED. Two anatomical levels closer than this are treated as a measurement error
  # rather than as real anatomy.
  minimum_separation_mm: 10.0

mesh:
  # Ring columns over the full 360 degrees. Must be a multiple of 4 so centre front,
  # right side, centre back and left side land exactly on a column.
  #
  # The three resolutions below are capped by the flattening solver, not by the geometry:
  # LSCM and ARAP are solved with dense NumPy matrices, whose memory grows with the square
  # of the panel vertex count. 48 x 4 x 16 puts a panel at ~220 vertices and the largest
  # matrix at a few megabytes. See `ponytail:` in flattening/parameterization.py - with
  # SciPy's sparse solvers these could go several times higher.
  cross_section_resolution: 48
  # Rows inserted between two consecutive anatomical levels.
  longitudinal_segments: 4
  # Rows in a flattened panel's grid, from its trim curve down to the hem.
  panel_rows: 16
  smoothing:
    # Monotone cubic interpolation of the (a, b) stack through the level values. It has no
    # tuning parameter on purpose: the tangents come from the data (Fritsch-Carlson), the
    # curve passes exactly through every measured section, and monotonicity means it can
    # never overshoot into a narrower waist or a wider bust than the one measured.
    method: monotone_cubic

garment:
  ease_presets:
    skin_thin:     { bust_mm: 20.0, waist_mm: 20.0, hip_mm: 20.0, armhole_mm: 10.0 }
    close_fitting: { bust_mm: 50.0, waist_mm: 50.0, hip_mm: 50.0, armhole_mm: 20.0 }
    fitted:        { bust_mm: 80.0, waist_mm: 80.0, hip_mm: 80.0, armhole_mm: 30.0 }
    relaxed:       { bust_mm: 140.0, waist_mm: 140.0, hip_mm: 140.0, armhole_mm: 50.0 }
  default_ease_preset: fitted
  # ASSUMED. Armhole ease is a circumference in the input and a level in the geometry:
  # the underarm is dropped by this fraction of it. 0.5 splits the ease between the front
  # and the back of the armscye.
  armhole_ease_drop_fraction: 0.5
  # Ease between two levels is blended with a smoothstep, so the garment surface has no
  # crease where two ease values meet.
  interpolation: smoothstep

seams:
  preset: basic_torso_v1
  # ASSUMED. Neckline depth below the neck reference level. These are the two numbers a
  # user is most likely to want to change, and neither is measured: body_measurements.yaml
  # carries no neckline. 70/20 mm is a plain round neck.
  front_neck_drop_mm: 70.0
  back_neck_drop_mm: 20.0
  # ASSUMED. Shape exponents for the two cut curves. 1.0 is a quarter-ellipse neckline and
  # a sine-eased armscye; they are drawn, not derived.
  neckline_power: 1.0
  armscye_power: 1.0
  # The shoulder tip is placed at the measured across-shoulder half-breadth on the
  # upper-chest section. Rejected when that breadth falls outside the section.
  balance:
    # Front and back shoulder seams are matched in 3D by moving the back neck point.
    max_iterations: 12
    tolerance_mm: 0.5

flattening:
  # lscm_arap: least-squares conformal map for the initial layout, as-rigid-as-possible
  # refinement after it.
  method: lscm_arap
  arap:
    max_iterations: 120
    # Converged when the ARAP energy drops by less than this fraction in one pass. ARAP
    # converges linearly, so the tail is slow: at 1e-6 the energy is settled in its
    # seventh significant digit and the layout no longer moves by a measurable amount.
    energy_tolerance: 1.0e-6
  objective:
    # Weights of the energy terms. ASSUMED: w_distortion is the ARAP energy and carries
    # the result; the soft terms are deliberately small so a seam constraint nudges the
    # layout instead of overruling the shape. E_flip is not a weight here - a flipped
    # triangle is rejected outright, which is the strongest penalty available.
    w_distortion: 1.0
    w_boundary: 0.05
    w_seam: 0.05
    w_grain: 0.0
    w_flip: 0.0
  # The grain runs along the centre front / centre back, which is how a torso panel is
  # cut. Applied as an exact rigid alignment after the solve, so it costs no distortion.
  grain_axis: center_line
  # Hard gate: any flipped triangle rejects the panel.
  max_flipped_triangles: 0

boundary_refit:
  # Douglas-Peucker tolerance on the flattened boundary before curve fitting.
  simplify_tolerance_mm: 0.6
  # An interval whose maximum deviation from its own chord is under this is a straight
  # line, not a curve.
  straight_tolerance_mm: 0.8
  # ASSUMED. A single cubic per semantic interval must stay inside this band or the fit
  # is rejected. Calibrated against the four supplied profiles only, where the worst
  # interval lands near 0.5 mm.
  max_deviation_mm: 1.5
  # Samples per interval used to measure the fit.
  samples: 96
  # Minimum points an interval keeps after simplification.
  min_points: 4
  # A cubic has four unknowns, so fitting one to three or four points reproduces them
  # exactly while the handles are free to swing anywhere - which is how a short neckline
  # ends up crossing the shoulder seam it meets. Below this many points the simplified
  # polyline is used instead; it is exact there anyway.
  min_points_for_cubic: 6
  # ASSUMED. A handle longer than this multiple of the chord means the same thing: a fit
  # that passes through its points on a path no pattern edge takes. Rejected in favour of
  # the polyline.
  max_handle_ratio: 2.0

tolerances:
  # Flattening diagnostics that block an export.
  flipped_triangles: 0
  boundary_self_intersections: 0
  # ASSUMED. Angular distortion is reported, not gated: no garment standard gives a
  # number, and gating on an uncalibrated one would reject valid patterns. The limits
  # below are warnings.
  warn_mean_angular_distortion_deg: 3.0
  warn_max_area_distortion: 0.15
